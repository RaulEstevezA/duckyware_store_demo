<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duckyware</title>
    <meta name="description" content="DuckyWare: computer hardware online store built with Django for CS50W. Static GitHub Pages demo with a simulated backend.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rowdies:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Original DuckyWare CSS (copied from store/static/store/css by tools/build_site.py) -->
    <link rel="stylesheet" href="static/store/css/general.css">
    <link rel="stylesheet" href="static/store/css/layout.css">
    <link rel="stylesheet" href="static/store/css/home.css">
    <link rel="stylesheet" href="static/store/css/category_search.css">
    <link rel="stylesheet" href="static/store/css/product_view.css">
    <link rel="stylesheet" href="static/store/css/cart.css">
    <link rel="stylesheet" href="static/store/css/checkout.css">
    <!-- GitHub Pages demo additions -->
    <link rel="stylesheet" href="css/demo.css">
    <!-- Icons: the CS50 rubber duck of the original store (static/store/images/cs50_logo.ico) in light sizes -->
    <link rel="icon" href="icons/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#F7FF40">
</head>
<body>
    <div id="app">
        <p class="app-loading">Loading DuckyWare...</p>
    </div>
    <noscript>
        <p class="app-loading">This demo needs JavaScript: the Django backend is simulated in the browser.</p>
    </noscript>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- SweetAlert JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- App -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
